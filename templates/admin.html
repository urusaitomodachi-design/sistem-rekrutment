<!DOCTYPE html>
<html>
<head><title>Dashboard Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3></h3>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>

        {% if not active_session %}
        <div class="card p-4 shadow mb-4">
            <h5>Mulai Sesi Rekrutmen Baru</h5>
            <form method="POST">
                <input type="hidden" name="action" value="start">
                <div class="mb-3">
                    <label>Nama PT:</label>
                    <input type="text" name="pt_name" class="form-control text-uppercase" required>
                </div>
                <div class="mb-3">
                    <label>Departemen:</label>
                    <input type="text" name="department" class="form-control text-uppercase" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Buat Sesi & Tampilkan Barcode</button>
            </form>
        </div>
        {% else %}
        <div class="card p-4 shadow mb-4 text-center">
            <h4 class="text-primary">PT: {{ active_session[1] }}</h4>
            <h5>Departemen: {{ active_session[2] }}</h5>
            <p class="text-muted">Kandidat Masuk: <b>{{ candidate_count }}</b> orang</p>
            <hr>
            <p class="small text-muted"></p>
            <div id="qrcode" class="d-flex justify-content-center mb-3"></div>
            
            <div class="d-flex gap-2 mt-3">
                <form method="POST" class="flex-grow-1">
                    <input type="hidden" name="action" value="stop">
                    <button type="submit" class="btn btn-warning w-100">Matikan Link</button>
                </form>
                <form method="POST" class="flex-grow-1">
                    <input type="hidden" name="action" value="download">
                    <button type="submit" class="btn btn-primary w-100">Download Excel & Reset</button>
                </form>
            </div>
        </div>
        <script>
            function generateQR() {
                document.getElementById("qrcode").innerHTML = "";
                let randomToken = Math.random().toString(36).substring(2, 10);
                let currentUrl = window.location.origin + "/apply/" + randomToken;
                new QRCode(document.getElementById("qrcode"), {
                    text: currentUrl,
                    width: 200,
                    height: 200
                });
            }
            generateQR();
            setInterval(generateQR, 120000); // 2 menit
        </script>
        {% endif %}
    </div>
</body>
</html>
