<!DOCTYPE html>
<html>
<head><title>Form Pendaftaran Kandidat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 400px;">
        <h4 class="text-center mb-1">Form Kandidat Operator</h4>
        <p class="text-center text-muted small">PT: {{ session_info[1] }} | {{ session_info[2] }}</p>
        
        <form method="POST">
            <div class="mb-3">
                <label>No Registrasi:</label>
                <input type="text" name="reg_no" class="form-control text-uppercase" oninput="this.value = this.value.toUpperCase()" required>
            </div>
            <div class="mb-3">
                <label>Nama Lengkap:</label>
                <input type="text" name="full_name" class="form-control text-uppercase" oninput="this.value = this.value.toUpperCase()" required>
            </div>
            <div class="mb-3">
                <label>Operator Apa:</label>
                <input type="text" name="operator_type" class="form-control text-uppercase" oninput="this.value = this.value.toUpperCase()" required>
            </div>
            <div class="mb-3">
                <label>No WA Aktif:</label>
                <input type="text" name="whatsapp" class="form-control text-uppercase" oninput="this.value = this.value.toUpperCase()" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Kirim Data</button>
        </form>
    </div>
</body>
</html>
